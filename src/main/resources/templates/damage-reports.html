<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Damage Reports</title>
</head>
<body>
<header class="topbar">
    <span class="logo">LOGO</span>
    <span class="brand">Bilabonnement</span>
</header>

<table>
    <thead>
        <tr>
            <th>Contract ID</th>
            <th>Report ID</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="report : ${reports}">
            <td th:text="${report.getContractId()}"></td>
            <td th:text="${report.getId()}"></td>
            <td th:text="${report.getReportDate()}"></td>
            <td><a th:href="@{/damage-reports/{reportId}(reportId=${report.id})}">View</a></td>
        </tr>
    </tbody>
</table>
</body>
</html>
