<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cars</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header th:replace="~{fragments/header :: header}"></header>

        <main class="page">
            <section>
                <h1>Cars</h1>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>License plate</th>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Year</th>
                            <th>Mileage</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="clickable-row" th:each="car : ${cars}">
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}" th:text="${car.licensePlate}"></a></td>
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}" th:text="${car.brand}"></a></td>
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}" th:text="${car.model}"></a></td>
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}" th:text="${car.year}"></a></td>
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}" th:text="${car.mileage}"></a></td>
                            <td><a th:href="@{/car/{id}/showCar(id=${car.id})}">View</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(cars)}">
                            <td colspan="6">No cars found</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </body>
</html>
