<!--/*@thymesVar id="car" type="com.gruppe4.projekt3_gruppe_4.model.Car"*/-->
<!-- Include with: th:replace="~{create-car :: createCar}" -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="createCar" class="car-form">
    <link rel="stylesheet" href="../static/style.css" th:href="@{/style.css}">
    <button type="button" popovertarget="create-car" popovertargetaction="show">Create Car</button>

    <!-- Manual mode keeps the form open when clicking outside. -->
    <div id="create-car" popover="manual" aria-labelledby="create-car-title">
        <h2 id="create-car-title">Create Car</h2>
        <p role="alert" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/cars/create}" th:object="${car}" method="post">
            <label for="vin">VIN</label>
            <input id="vin" type="text" th:field="*{vin}" minlength="17" maxlength="17" required>

            <label for="licensePlate">License plate</label>
            <input id="licensePlate" type="text" th:field="*{licensePlate}" maxlength="7" required>

            <label for="brand">Brand</label>
            <input id="brand" type="text" th:field="*{brand}" maxlength="50" required>

            <label for="model">Model</label>
            <input id="model" type="text" th:field="*{model}" maxlength="50" required>

            <label for="trimLevel">Trim level</label>
            <input id="trimLevel" type="text" th:field="*{trimLevel}" maxlength="50" required>

            <label for="mileage">Mileage (km)</label>
            <input id="mileage" type="number" th:field="*{mileage}" min="0" step="1" required>

            <label for="basePrice">Base price (DKK)</label>
            <input id="basePrice" type="number" th:field="*{basePrice}" min="0.01" max="99999999.99" step="0.01" required>

            <label for="co2Emission">CO2 emission (g/km)</label>
            <input id="co2Emission" type="number" th:field="*{co2Emission}" min="0" max="9999.9" step="0.1" required>

            <label for="year">Year</label>
            <input id="year" type="number" th:field="*{year}" step="1" required>

            <!-- The controller must supply locations from the database. -->
            <label for="currentLocationId">Location</label>
            <select id="currentLocationId" th:field="*{currentLocationId}" required>
                <option value="" disabled>Select a location</option>
                <option th:each="location : ${locations}"
                        th:value="${location.id}" th:text="${location.name}"></option>
            </select>

            <button type="button" popovertarget="create-car" popovertargetaction="hide">Cancel</button>
            <button type="submit">Create</button>
        </form>
    </div>

    <!-- Reopen the form after a validation error. -->
    <script th:if="${openCreateCar}">
        document.getElementById("create-car").showPopover();
    </script>
</div>
