<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <title>Damage Form</title>
    </head>
    <body>
        <header th:replace="~{fragments/header :: header('damage')}"></header>

        <main class="page">
            <form class="form card card-sm" th:action="@{/damage/add}" method="post" th:object="${damage}">
                <div class="form-field">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" maxlength="255"></textarea>
                </div>

                <div class="form-field">
                    <label for="repairCost">Repair cost</label>
                    <input id="repairCost" type="number" th:field="*{repairCost}" step="0.01" min="0.01">
                </div>

                <input type="hidden" th:field="*{damageReportId}">

                <div class="form-actions">
                    <button type="submit" class="btn">Add damage</button>
                </div>
            </form>
        </main>
    </body>
</html>
