<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Damage Form</title>
</head>
<body>
<header class="topbar">
    <span class="logo">LOGO</span>
    <span class="brand">Bilabonnement</span>
</header>

<form th:action="@{/damage/add}" method="post">
    <label for="description">Description</label>
    <textarea id="description" name="description" maxlength="255"></textarea>

    <label for="repairCost">Repair cost</label>
    <input type="number" id="repairCost" step="0.01" min="0">

    <button type="submit">Add damage</button>
</form>
</body>
</html>
