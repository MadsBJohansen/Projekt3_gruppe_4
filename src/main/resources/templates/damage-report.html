<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Damage Report</title>
</head>
<body>
<header class="topbar">
    <span class="logo">LOGO</span>
    <span class="brand">Bilabonnement</span>
</header>
    <table>
        <thead>
            <tr>
                <th>Damage ID</th>
                <th>Report ID</th>
                <th>Description</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="damage : ${damages}">
                <td th:text="${damage.getId()}"></td>
                <td th:text="${damage.getDamageReportId()}"></td>
                <td th:text="${damage.getDescription()}"></td>
                <td th:text="${damage.getRepairCost()}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
