<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <title>Customer</title>
    </head>
    <body>
        <div th:replace="~{fragments/header :: header('customers')}"></div>

        <main class="page">
            <div class="workspace-grid" th:object="${customer}">
                <div class="card">
                    <span th:text="*{firstName}">First name</span>
                    <span th:text="*{lastName}">Last name</span>
                </div>
                <div class="card">
                    <span th:text="*{email}">Email</span>
                </div>
                <div class="card">
                    <span th:text="*{phoneNumber}">Phone number</span>
                </div>
                <div class="card">
                    <span th:text="*{streetAddress}">Street address</span>
                </div>
                <div class="card">
                    <span th:object="${zipCode}" th:text="*{zipCode}">Zip code</span>
                </div>
                <div class="card">
                    <span th:object="${zipCode}" th:text="*{city}">City</span>
                </div>
            </div>

            <button type="button" class="btn" popovertarget="edit-customer">Edit customer</button>
            <div id="edit-customer" popover class="modal modal-sm">
                <form class="form form-grid" th:object="${customer}" th:action="@{/customer/updateCustomer}" method="post">
                    <h2 class="span-all">Edit customer</h2>

                    <div class="form-field">
                        <label for="firstName">First name</label>
                        <input id="firstName" type="text" th:field="*{firstName}" required>
                    </div>

                    <div class="form-field">
                        <label for="lastName">Last name</label>
                        <input id="lastName" type="text" th:field="*{lastName}" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" type="text" th:field="*{email}" required>
                    </div>

                    <div class="form-field">
                        <label for="phoneNumber">Phone number</label>
                        <input id="phoneNumber" type="text" th:field="*{phoneNumber}" required>
                    </div>

                    <div class="form-field">
                        <label for="streetAddress">Street address</label>
                        <input id="streetAddress" type="text" th:field="*{streetAddress}" required>
                    </div>

                    <div class="form-field">
                        <label for="zipCodeId">City and zip code</label>
                        <select id="zipCodeId" name="zipCodeId">
                            <option th:each="zipcode :${zipCodes}"
                                th:value="${zipcode.getZipCodeId()}"
                                th:text="${zipcode.getCity() + ' ' + zipcode.getZipCode()}"></option>
                        </select>
                    </div>

                    <div class="form-actions span-all">
                        <button type="submit" class="btn">Update</button>
                        <button type="button" popovertarget="edit-customer" popovertargetaction="hide" class="btn">Cancel</button>
                    </div>
                </form>
                <form class="form" th:object="${customer}" th:action="@{/customer/archiveCustomer}" method="post" onsubmit="return confirm('DELETE CUSTOMER!!??')">
                    <input type="hidden" name="customerId" th:value="${customerId}">
                    <div class="form-actions">
                        <button type="submit" class="btn">DELETE</button>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
