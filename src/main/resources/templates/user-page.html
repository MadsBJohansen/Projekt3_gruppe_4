<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User page</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>User page</h1>


<button class="btn" type="button" popovertarget="create-customer">+ Create Customer</button>
<div id="create-customer" popover class="modal">
    <form class="modal-form" th:action="@{/customer/createCustomer}" method="post">
        <h2>New customer</h2>

        <label for="firstName">First name</label>
        <input id="firstName" type="text" name="firstName" required>

        <label for="lastName">Last name</label>
        <input id="lastName" type="text" name="lastName" required>

        <label for="email">Email</label>
        <input id="email" type="text" name="email" required>

        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="text" name="phoneNumber" required>

        <label for="streetAddress">Street address</label>
        <input id="streetAddress" type="text" name="streetAddress" required>

        <label for="zipCode">Zip code</label>
        <input id="zipCode" type="text" name="zipCode" required>

        <button type="submit">Create</button>
        <button type="button" popovertarget="create-customer"
                popovertargetaction="hide">Cancel</button>

    </form>

</div>

<button class="btn" type="button" popovertarget="create-car">
    + Create Car
</button>

<div id="create-car" popover class="modal">
    <form class="modal-form" th:action="@{/car/cars/create}" method="post">
        <h2>New car</h2>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <label for="vin">VIN</label>
        <input id="vin" type="text" name="vin"
               minlength="17" maxlength="17" required>

        <label for="licensePlate">License plate</label>
        <input id="licensePlate" type="text" name="licensePlate"
               maxlength="7" required>

        <label for="brand">Brand</label>
        <input id="brand" type="text" name="brand" maxlength="50" required>

        <label for="model">Model</label>
        <input id="model" type="text" name="model" maxlength="50" required>

        <label for="trimLevel">Trim level</label>
        <input id="trimLevel" type="text" name="trimLevel"
               maxlength="50" required>

        <label for="year">Year</label>
        <input id="year" type="number" name="year"
               th:min="${#dates.year(#dates.createNow()) - 5}"
               step="1" required>

        <label for="mileage">Mileage (km)</label>
        <input id="mileage" type="number" name="mileage"
               min="0" step="1" required>

        <label for="basePrice">Base price (DKK)</label>
        <input id="basePrice" type="number" name="basePrice"
               min="0.01" max="99999999.99" step="0.01" required>

        <label for="co2Emission">CO2 emission (g/km)</label>
        <input id="co2Emission" type="number" name="co2Emission"
               min="0" max="9999.9" step="0.1" required>

        <label for="currentLocationId">Location</label>
        <select id="currentLocationId" name="currentLocationId" required>
            <option value="" disabled selected>Select a location</option>
            <option th:each="location : ${locations}"
                    th:value="${location.id}"
                    th:text="${location.name}"></option>
        </select>

        <button type="submit">Create</button>
        <button type="button" popovertarget="create-car"
                popovertargetaction="hide">Cancel</button>
    </form>
</div>

<h2>Cars</h2>
<table>
    <thead>
    <tr>
        <th scope="col">License plate</th>
        <th scope="col">Brand</th>
        <th scope="col">Model</th>
        <th scope="col">Year</th>
        <th scope="col">Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.licensePlate}"></td>
        <td th:text="${car.brand}"></td>
        <td th:text="${car.model}"></td>
        <td th:text="${car.year}"></td>
        <td th:text="${car.status}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(cars)}">
        <td colspan="5">No cars registered.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
