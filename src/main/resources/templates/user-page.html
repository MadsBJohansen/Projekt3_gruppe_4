<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>User page</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header th:replace="~{fragments/header :: header}"></header>

        <main class="page">
            <section>
                <h1>Welcome, <span th:text="${session.user.firstName}"></span></h1>
                <div class="workspace-grid">
                    <button type="button" class="tools-card" popovertarget="create-contract">
                        <h3>+ Create Contract</h3>
                    </button>
                    <button type="button" class="tools-card" popovertarget="create-car">
                        <h3>+ Create Car</h3>
                    </button>
                    <a class="tools-card" th:href="@{/customer/showCustomers}">
                        <h3>+ Create Customer</h3>
                    </a>
                </div>
            </section>

            <div id="create-car" th:attr="popover=${openCreateCar == true ? null : 'auto'}"
                th:class="${openCreateCar == true ? 'modal-panel modal-lg modal-inline' : 'modal modal-lg'}">
                <form class="form form-grid" th:action="@{/car/cars/create}" th:object="${car}" method="post">
                    <h2 class="span-all">New car</h2>

                    <p class="error span-all" th:if="${error}" th:text="${error}"></p>

                    <div class="form-field">
                        <label for="vin">VIN</label>
                        <input id="vin" type="text" th:field="*{vin}"
                        minlength="17" maxlength="17" required>
                    </div>

                    <div class="form-field">
                        <label for="licensePlate">License plate</label>
                        <input id="licensePlate" type="text"
                               th:field="*{licensePlate}"
                               minlength="7"
                               maxlength="7"
                               pattern="[A-Z]{2}[0-9]{5}"
                               title="License plate must contain 2 letters and 5 digits."
                               required>
                    </div>

                    <div class="form-field">
                        <label for="brand">Brand</label>
                        <input id="brand" type="text" th:field="*{brand}" maxlength="50" required>
                    </div>

                    <div class="form-field">
                        <label for="model">Model</label>
                        <input id="model" type="text" th:field="*{model}" maxlength="50" required>
                    </div>

                    <div class="form-field">
                        <label for="trimLevel">Trim level</label>
                        <input id="trimLevel" type="text" th:field="*{trimLevel}"
                        maxlength="50" required>
                    </div>

                    <div class="form-field">
                        <label for="year">Year</label>
                        <input id="year" type="number" th:field="*{year}"
                        th:min="${#dates.year(#dates.createNow()) - 5}"
                        step="1" required>
                    </div>

                    <div class="form-field">
                        <label for="mileage">Mileage (km)</label>
                        <input id="mileage" type="number" th:field="*{mileage}"
                        min="0" step="1" required>
                    </div>

                    <div class="form-field">
                        <label for="basePrice">Base price (DKK)</label>
                        <input id="basePrice" type="number" th:field="*{basePrice}"
                        min="0.01" max="99999999.99" step="0.01" required>
                    </div>

                    <div class="form-field">
                        <label for="co2Emission">CO2 emission (g/km)</label>
                        <input id="co2Emission" type="number" th:field="*{co2Emission}"
                        min="0" max="9999.9" step="0.1" required>
                    </div>

                    <div class="form-field">
                        <label for="currentLocationId">Location</label>
                        <select id="currentLocationId" th:field="*{currentLocationId}" required>
                            <option value="0" disabled>Select a location</option>
                            <option th:each="location : ${locations}"
                                th:value="${location.id}"
                                th:text="${location.name}"></option>
                        </select>
                    </div>

                    <div class="form-actions span-all">
                        <button type="submit" class="btn">Create</button>
                        <button type="button" th:if="${openCreateCar != true}" popovertarget="create-car"
                            popovertargetaction="hide" class="btn">Cancel</button>
                        <a class="btn" th:if="${openCreateCar == true}" th:href="@{/user/showUser-page}">Cancel</a>
                    </div>
                </form>

            </div>
        </main>

    </body>
</html>
