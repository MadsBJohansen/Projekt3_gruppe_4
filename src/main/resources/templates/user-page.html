<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User page</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header(${tab})}"></header>

<main class="main">
    <section th:if="${tab == 'home'}">
        <h1>Welcome, <span th:text="${session.user.firstName}"></span></h1>
        <div class="workspace-grid">
             <button type="button" class="tools-card" popovertarget="create-contract">
                <h3>Create Contract</h3>
            </button>
            <button type="button" class="tools-card" popovertarget="create-car">
                <h3>Create Car</h3>
            </button>
            <button type="button" class="tools-card" popovertarget="create-customer">
                <h3> Create Customer</h3>
            </button>
        </div>
    </section>
    <section th:if="${tab == 'cars'}">
        <h1>Cars</h1>
            <table class="data-table">
                <thead>
                <tr>
                    <th>License plate</th>
                    <th>Brand</th>
                    <th>Model</th>
                    <th>Year</th>
                    <th>Mileage</th>
                </tr>
                </thead>
            <tbody>
                <tr th:each="car : ${cars}">
                <td th:text="${car.licensePlate}"></td>
                <td th:text="${car.brand}"></td>
                <td th:text="${car.model}"></td>
                <td th:text="${car.year}"></td>
                <td th:text="${car.mileage}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(cars)}">
                <td colspan="5">No cars found</td>
            </tr>
            </tbody>
        </table>
    </section>
    <section th:if="${tab == 'customers'}">
        <h1>customers</h1>
        <table class="data-table">
            <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone number</th>
                <th>Street address</th>
                <th>Zip Code</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.firstName}"></td>
                <td th:text="${customer.lastName}"></td>
                <td th:text="${customer.email}"></td>
                <td th:text="${customer.phoneNumber}"></td>
                <td th:text="${customer.streetAddress}"></td>
                <td th:text="${customer.zipCodeId}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="6">No customers found</td>
            </tr>
            </tbody>
        </table>
    </section>

    <div id="create-customer" popover class="modal">
        <form class="modal-form" th:object="${customer}" th:action="@{/customer/createCustomer}" method="post">
            <h2>New customer</h2>

            <label for="firstName">First name</label>
            <input id="firstName" type="text" th:field="*{firstName}" required>

            <label for="lastName">Last name</label>
            <input id="lastName" type="text" th:field="*{lastName}" required>

            <label for="email">Email</label>
            <input id="email" type="text" th:field="*{email}" required>

            <label for="phoneNumber">Phone number</label>
            <input id="phoneNumber" type="text" th:field="*{phoneNumber}" required>

            <label for="streetAddress">Street address</label>
            <input id="streetAddress" type="text" th:field="*{streetAddress}" required>

            <label for="zipCodeId">City and zip code</label>
            <select id="zipCodeId" name="zipCodeId">
                <option th:each="zipcode :${zipCodes}"
                        th:value="${zipcode.getZipCodeId()}"
                        th:text="${zipcode.getCity() + ' ' + zipcode.getZipCode()}"></option>
            </select>

            <button type="submit">Create</button>
            <button type="button" popovertarget="create-customer" popovertargetaction="hide">Cancel</button>
        </form>

    </div>

    <div id="create-car" th:attr="popover=${openCreateCar == true ? null : 'auto'}"
         th:class="${openCreateCar == true ? 'card' : 'modal'}">
        <form class="modal-form" th:action="@{/car/cars/create}" th:object="${car}" method="post">
            <h2>New car</h2>

            <p class="error" th:if="${error}" th:text="${error}"></p>

            <label for="vin">VIN</label>
            <input id="vin" type="text" th:field="*{vin}"
                   minlength="17" maxlength="17" required>

            <label for="licensePlate">License plate</label>
            <input id="licensePlate" type="text" th:field="*{licensePlate}"
                   maxlength="7" required>

            <label for="brand">Brand</label>
            <input id="brand" type="text" th:field="*{brand}" maxlength="50" required>

            <label for="model">Model</label>
            <input id="model" type="text" th:field="*{model}" maxlength="50" required>

            <label for="trimLevel">Trim level</label>
            <input id="trimLevel" type="text" th:field="*{trimLevel}"
                   maxlength="50" required>

            <label for="year">Year</label>
            <input id="year" type="number" th:field="*{year}"
                   th:min="${#dates.year(#dates.createNow()) - 5}"
                   step="1" required>

            <label for="mileage">Mileage (km)</label>
            <input id="mileage" type="number" th:field="*{mileage}"
                   min="0" step="1" required>

            <label for="basePrice">Base price (DKK)</label>
            <input id="basePrice" type="number" th:field="*{basePrice}"
                   min="0.01" max="99999999.99" step="0.01" required>

            <label for="co2Emission">CO2 emission (g/km)</label>
            <input id="co2Emission" type="number" th:field="*{co2Emission}"
                   min="0" max="9999.9" step="0.1" required>

            <label for="currentLocationId">Location</label>
            <select id="currentLocationId" th:field="*{currentLocationId}" required>
                <option value="0" disabled>Select a location</option>
                <option th:each="location : ${locations}"
                        th:value="${location.id}"
                        th:text="${location.name}"></option>
            </select>

            <button type="submit">Create</button>
            <button type="button" th:if="${openCreateCar != true}" popovertarget="create-car"
                    popovertargetaction="hide">Cancel</button>
            <a th:if="${openCreateCar == true}" th:href="@{/car/user-page}">Cancel</a>
        </form>

    </div>
</main>

</body>
</html>
