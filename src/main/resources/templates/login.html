<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="topbar">
        <span class="logo">LOGO</span>
        <span class="brand">Bilabonnement</span>
    </header>

    <main class="login-page">
        <div class="card">

            <h1>Login</h1>
            <p class="subtitle">Internal system for employees of Bilabonnement</p>

            <form th:action="@{/login}" method="post">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="fx. Demo" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <p class="error" th:if="${error}" th:text="${error}">Error message</p>

                <button type="submit">Login</button>
            </form>
        </div>
    </main>
</body>
</html>
